[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haptiq"
version = "0.1.0"
description = "Passive RH56DFTP telemetry, tactile visualization and CAD estimation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pymodbus>=3.16.1",
]

[project.optional-dependencies]
sensor-identification = ["scipy>=1.15", "trimesh>=4.6", "rtree>=1.3", "plotly>=6"]

[project.scripts]
haptiq = "haptiq.main:cli"
haptiq-viewer = "haptiq.server.launcher:main"
haptiq-estimate = "haptiq.estimation.__main__:main"
haptiq-build-viewer = "haptiq.digital_twin.rebuild_joint_viewer:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["haptiq*"]
namespaces = false

[tool.setuptools.package-data]
"haptiq.assets" = ["models/*.stl", "models/*.json"]
"haptiq.digital_twin" = ["*.html", "*.js", "*.json", "*.css", "frontend/*", "templates/*", "assets/*", "profile_sources/**/*.urdf", "sensor_identification/*.js", "sensor_identification/*.cjs", "sensor_identification/README.md"]


[dependency-groups]
dev = ["ruff==0.17.1"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["maintenance", "vendor", "sensor_identification_demo"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

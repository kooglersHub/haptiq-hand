name: Code quality and tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Python tools and dependencies
        run: python -m pip install ".[sensor-identification]" ruff==0.17.1
      - name: Python lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Install JavaScript development tools
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: JavaScript formatting and unit tests
        run: |
          npm run format:check
          npm test
      - name: Python unit and integration tests
        run: python -B -m unittest discover -s tests -v
